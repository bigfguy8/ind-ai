name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Create gradle.properties
        run: |
          printf 'android.useAndroidX=true\n' > gradle.properties
          printf 'android.nonTransitiveRClass=true\n' >> gradle.properties
          printf 'org.gradle.jvmargs=-Xmx2048m\n' >> gradle.properties
          printf 'INDAI_API_KEY=\n' >> gradle.properties
          printf 'INDAI_ENDPOINT=https://text.pollinations.ai/v1/chat/completions\n' >> gradle.properties
          printf 'INDAI_MODEL=openai-fast\n' >> gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ind-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
