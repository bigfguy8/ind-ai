plugins {
    id 'com.android.application'
}

android {
    namespace 'com.indai.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.indai.assistant"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.6.1"

        buildConfigField "String", "INDAI_API_KEY",
                "\"${project.findProperty('INDAI_API_KEY') ?: ''}\""
        buildConfigField "String", "INDAI_ENDPOINT",
                "\"${project.findProperty('INDAI_ENDPOINT') ?: 'https://apihub.agnes-ai.com/v1/chat/completions'}\""
        buildConfigField "String", "INDAI_MODEL",
                "\"${project.findProperty('INDAI_MODEL') ?: 'agnes-3.0-flash'}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
